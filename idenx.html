<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>商品选购</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;padding-bottom:80px}
.header{background:#fff;padding:16px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.header h1{font-size:18px;font-weight:600}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
@media(min-width:768px){.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.product-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s}
.product-card:active{transform:scale(.98)}
.product-image{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:48px;background:#f0f0f0}
.product-info{padding:10px 12px 12px}
.product-name{font-size:14px;font-weight:500;margin-bottom:4px}
.product-desc{font-size:12px;color:#999;margin-bottom:8px}
.product-bottom{display:flex;align-items:center;justify-content:space-between}
.product-price{font-size:16px;font-weight:600;color:#FF6B35}
.product-price::before{content:'¥';font-size:12px}
.add-btn{width:28px;height:28px;border-radius:50%;background:#FF6B35;color:#fff;border:none;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:20}
.cart-info{display:flex;align-items:center;gap:12px}
.cart-icon{position:relative;font-size:24px}
.cart-badge{position:absolute;top:-6px;right:-8px;background:#FF6B35;color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cart-total{font-size:18px;font-weight:600;color:#FF6B35}
.cart-total::before{content:'¥';font-size:13px}
.checkout-btn{background:#FF6B35;color:#fff;border:none;padding:10px 28px;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer}
.checkout-btn:disabled{background:#ccc}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.modal-header{padding:16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;color:#999;cursor:pointer}
.modal-body{padding:16px}
.order-item{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.order-item .name{color:#666}
.order-item .price{font-weight:500}
.order-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed #eee;font-size:16px;font-weight:600}
.order-total .amount{color:#FF6B35}
.pay-tabs{display:flex;gap:8px;margin:16px 0}
.pay-tab{flex:1;padding:10px;border:1px solid #eee;border-radius:10px;background:#fafafa;text-align:center;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pay-tab.active{border-color:#FF6B35;background:#FFF5F0;color:#FF6B35;font-weight:500}
.qr-area{text-align:center;padding:16px 0}
.qr-area img{width:200px;height:200px;object-fit:contain;border:1px solid #f0f0f0;border-radius:8px}
.qr-placeholder{width:200px;height:200px;margin:0 auto;border:2px dashed #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;text-align:center;padding:20px}
.qr-hint{margin-top:10px;font-size:13px;color:#666}
.qr-hint strong{color:#FF6B35}
.btn-paid{width:100%;padding:14px;background:#07C160;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;margin-top:16px}
.success-tip{text-align:center;padding:20px 0}
.success-tip .icon{font-size:48px;margin-bottom:12px}
.success-tip h3{font-size:18px;margin-bottom:8px}
.success-tip p{font-size:14px;color:#666}
</style>
</head>
<body>
<div class="header"><h1>🛍️ 精选商品</h1></div>
<div class="product-grid" id="productGrid"></div>

<div class="cart-bar">
  <div class="cart-info">
    <div class="cart-icon">🛒<span class="cart-badge" id="cartBadge" style="display:none">0</span></div>
    <div class="cart-total" id="cartTotal">0.00</div>
  </div>
  <button class="checkout-btn" id="checkoutBtn" disabled onclick="openCheckout()">去结算</button>
</div>

<div class="modal-overlay" id="payModal">
  <div class="modal">
    <div class="modal-header">
      <h2>确认支付</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ===== 商品数据：改这里 =====
const products = [
  { id:1, name:'商品名称一', price:29.90, desc:'这是商品描述', emoji:'🍎' },
  { id:2, name:'商品名称二', price:49.90, desc:'这是商品描述', emoji:'🍊' },
  { id:3, name:'商品名称三', price:19.90, desc:'这是商品描述', emoji:'🍇' },
  { id:4, name:'商品名称四', price:99.00, desc:'这是商品描述', emoji:'🍰' },
];

// ===== 收款码图片：改这里 =====
const QR_WECHAT = 'wechat-qr.png';
const QR_ALIPAY = 'alipay-qr.png';

let cart = {};

function renderProducts(){
  document.getElementById('productGrid').innerHTML = products.map(p=>`
    <div class="product-card">
      <div class="product-image">${p.emoji}</div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-bottom">
          <div class="product-price">${p.price.toFixed(2)}</div>
          <button class="add-btn" onclick="addToCart(${p.id})">+</button>
        </div>
      </div>
    </div>`).join('');
}

function addToCart(id){
  cart[id] = (cart[id]||0)+1;
  updateCartUI();
}

function updateCartUI(){
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const total = Object.entries(cart).reduce((s,[id,q])=>{
    const p = products.find(x=>x.id===Number(id));
    return s + (p?p.price*q:0);
  },0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = count;
  badge.style.display = count>0?'flex':'none';
  document.getElementById('cartTotal').textContent = total.toFixed(2);
  document.getElementById('checkoutBtn').disabled = count===0;
}

function openCheckout(){
  if(!Object.keys(cart).length) return;
  const items = Object.entries(cart).map(([id,q])=>{
    const p = products.find(x=>x.id===Number(id));
    return {...p, qty:q};
  });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);

  document.getElementById('modalBody').innerHTML = `
    <div>${items.map(i=>`
      <div class="order-item">
        <span class="name">${i.name} × ${i.qty}</span>
        <span class="price">¥${(i.price*i.qty).toFixed(2)}</span>
      </div>`).join('')}
    </div>
    <div class="order-total"><span>合计</span><span class="amount">¥${total.toFixed(2)}</span></div>
    <div class="pay-tabs">
      <div class="pay-tab active" data-pay="wechat" onclick="switchPay('wechat')">💚 微信支付</div>
      <div class="pay-tab" data-pay="alipay" onclick="switchPay('alipay')">💙 支付宝</div>
    </div>
    <div class="qr-area">
      <img id="qrImage" src="${QR_WECHAT}" alt="收款码"
        onerror="this.style.display='none';document.getElementById('qrPlaceholder').style.display='flex'">
      <div class="qr-placeholder" id="qrPlaceholder" style="display:none">
        请将收款码保存为<br><strong>${QR_WECHAT}</strong><br>并放在同目录下
      </div>
      <div class="qr-hint">
        请使用<strong id="payName">微信</strong>扫码支付 <strong>¥${total.toFixed(2)}</strong><br>
        <span style="font-size:12px;color:#999">金额需手动输入，请核对无误</span>
      </div>
    </div>
    <button class="btn-paid" onclick="confirmPaid()">我已完成支付</button>`;
  document.getElementById('payModal').classList.add('active');
}

function switchPay(type){
  document.querySelectorAll('.pay-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.pay-tab[data-pay="${type}"]`).classList.add('active');
  const img = document.getElementById('qrImage');
  const ph = document.getElementById('qrPlaceholder');
  const name = document.getElementById('payName');
  if(type==='wechat'){
    img.src = QR_WECHAT; name.textContent='微信';
    ph.innerHTML = `请将微信收款码保存为<br><strong>${QR_WECHAT}</strong><br>并放在同目录下`;
  }else{
    img.src = QR_ALIPAY; name.textContent='支付宝';
    ph.innerHTML = `请将支付宝收款码保存为<br><strong>${QR_ALIPAY}</strong><br>并放在同目录下`;
  }
  img.style.display='block'; ph.style.display='none';
}

function confirmPaid(){
  document.getElementById('modalBody').innerHTML = `
    <div class="success-tip">
      <div class="icon">✅</div>
      <h3>支付确认已提交</h3>
      <p>请等待商家核对收款<br>如有疑问请联系商家</p>
      <button class="btn-paid" style="background:#FF6B35;margin-top:24px" onclick="closeModal()">完成</button>
    </div>`;
  cart = {};
  updateCartUI();
}

function closeModal(){
  document.getElementById('payModal').classList.remove('active');
}

document.getElementById('payModal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

renderProducts();
updateCartUI();
</script>
</body>
</html>
